<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>A Locked Diary — Enter the Date</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Parisienne&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
<link rel="stylesheet" href="css/responsive.css" />
<style>
  body { background: var(--sky-gradient); }

  .diary {
    width: min(90vw, 26rem);
    background: linear-gradient(160deg, #fffaf3, var(--cream));
    border-radius: var(--radius-soft);
    box-shadow: var(--shadow-soft), 0 0 0 1px rgba(255,255,255,0.6) inset;
    padding: var(--space-lg) var(--space-md);
    position: relative;
    border: 1px solid rgba(247,215,116,0.5);
  }
  .diary::before {
    content: '';
    position: absolute; inset: 0.5rem;
    border: 1px dashed rgba(247,215,116,0.6);
    border-radius: calc(var(--radius-soft) - 0.3rem);
    pointer-events: none;
  }
  .diary-lock {
    width: 3.4rem; height: 3.4rem;
    margin: 0 auto var(--space-sm);
    border-radius: 50%;
    background: var(--gold-shimmer);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.5rem;
    box-shadow: var(--shadow-gold);
  }
  .diary-lock.is-unlocked { animation: popIn 0.5s ease; }

  .diary form {
    display: flex; flex-direction: column; align-items: center;
    gap: var(--space-sm);
    margin-top: var(--space-sm);
  }
  .diary input[type="password"], .diary input[type="text"] {
    width: 100%;
    text-align: center;
    letter-spacing: 0.3em;
    font-size: 1.2rem;
    padding: 0.85em 1em;
    border-radius: var(--radius-pill);
    border: 1px solid rgba(90,74,82,0.2);
    background: rgba(255,255,255,0.7);
    color: var(--text);
  }
  .diary input:focus-visible { outline: 3px solid var(--lavender); outline-offset: 2px; }

  .diary.is-shaking { animation: shakeDiary 0.5s; }
  @keyframes shakeDiary {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-0.6rem) rotate(-1deg); }
    40% { transform: translateX(0.6rem) rotate(1deg); }
    60% { transform: translateX(-0.4rem); }
    80% { transform: translateX(0.4rem); }
  }

  .hint-msg {
    min-height: 1.6em;
    font-size: var(--fs-small);
    color: #c47a8f;
  }
  .hint-msg.is-success { color: #6fae8c; }
</style>
</head>
<body>
  <audio data-bg-music loop preload="auto" src="assets/music/soft-piano.mp3"></audio>

  <main class="scene">
    <div class="particles-layer" data-particles="stars" data-count="16" aria-hidden="true"></div>

    <div class="scene__content">
      <p class="eyebrow">a page only she can open</p>
      <h1 class="title">The Locked Diary</h1>

      <div class="diary fade-in is-visible" id="diary">
        <div class="diary-lock" id="diaryLock">🔒</div>
        <p class="body-text" style="font-size: var(--fs-body);">This diary only opens for one special date.<br>Hint: it's the day <em>you</em> were born.</p>
        <form id="passwordForm" autocomplete="off" novalidate>
          <label for="passwordInput" class="visually-hidden">Enter the date as DDMMYYYY</label>
          <input
            type="password"
            id="passwordInput"
            name="passwordInput"
            inputmode="numeric"
            maxlength="8"
            placeholder="DDMMYYYY"
            aria-describedby="hintMsg"
          />
          <button type="submit" class="btn">Unlock the Diary 🔑</button>
        </form>
        <p id="hintMsg" class="hint-msg" role="status" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <div class="page-transition-veil"><p class="script">The diary creaks open…</p></div>

  <script src="js/particles.js"></script>
  <script src="js/music.js"></script>
  <script>
    (function () {
      const CORRECT = '08082002';
      const form = document.getElementById('passwordForm');
      const input = document.getElementById('passwordInput');
      const diary = document.getElementById('diary');
      const lock = document.getElementById('diaryLock');
      const hint = document.getElementById('hintMsg');
      const veil = document.querySelector('.page-transition-veil');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        const value = input.value.trim();

        if (value === CORRECT) {
          lock.textContent = '🔓';
          lock.classList.add('is-unlocked');
          hint.textContent = 'The diary opens with a soft glow…';
          hint.classList.add('is-success');
          veil.classList.add('is-active');
          window.setTimeout(() => { window.location.href = 'beginning.html'; }, 900);
        } else {
          diary.classList.remove('is-shaking');
          void diary.offsetWidth; /* restart animation */
          diary.classList.add('is-shaking');
          hint.classList.remove('is-success');
          hint.textContent = 'Hmm, that\'s not quite it… try again 💗';
          input.value = '';
          input.focus();
        }
      });
    })();
  </script>
</body>
</html>
